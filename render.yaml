services:
  - type: web
    name: gaja-stock-control-pro
    env: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
    disk:
      name: gaja-stock-pro-data
      mountPath: /data
      sizeGB: 1
